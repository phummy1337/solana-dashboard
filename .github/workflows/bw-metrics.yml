name: List Blockworks metrics

# Looks up metric slugs by keyword. Adding a Blockworks-backed card means
# knowing what the series is called, and the catalogue is behind the API key,
# which lives here rather than on anyone's laptop.
#
# Prints slugs and titles only, never values: this repository is public, so its
# Actions logs are public too, and the data itself is licensed.

on:
  workflow_dispatch:
    inputs:
      match:
        description: "Case-insensitive substring to match against slug or title"
        type: string
        required: false
        default: "meme"
      chart:
        description: "Chart id to describe (columns and date range only, no values)"
        type: string
        required: false
        default: ""

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Search the catalogue
        env:
          BLOCKWORKS_API_KEY: ${{ secrets.BLOCKWORKS_API_KEY }}
          MATCH: ${{ github.event.inputs.match }}
          CHART: ${{ github.event.inputs.chart }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          key = os.environ["BLOCKWORKS_API_KEY"]
          want = (os.environ.get("MATCH") or "").lower()

          def fetch(path):
              req = urllib.request.Request(
                  f"https://api.blockworks.com/{path}",
                  headers={"x-api-key": key,
                           "User-Agent": "solana-dashboard/1.0 (+metrics-catalogue)"})
              return json.load(urllib.request.urlopen(req, timeout=60))

          # Describing a chart: shape only -- column names, row count, date span.
          # No values are printed; this repo's Actions logs are public and the
          # data is licensed.
          chart_id = (os.environ.get("CHART") or "").strip()
          if chart_id:
              d = fetch(f"v1/charts/{chart_id}/data?limit=2000&page=1")
              rows = d.get("data") or []
              print(f"chart {chart_id}: {d.get('total', '?')} rows total, "
                    f"{len(rows)} in page 1")
              if rows:
                  print("columns:", sorted(rows[0].keys()))
                  dates = [r.get("date") or r.get("dt") or r.get("block_date")
                           for r in rows]
                  dates = [x for x in dates if x]
                  if dates:
                      print(f"date span: {min(dates)[:10]} -> {max(dates)[:10]}")
                  # distinct values of any obvious dimension column
                  for col in ("chain", "blockchain", "project", "name", "label"):
                      vals = {r.get(col) for r in rows if r.get(col)}
                      if vals:
                          print(f"{col}: {len(vals)} distinct -> "
                                + ", ".join(sorted(map(str, vals))[:14]))
              raise SystemExit(0)

          # The catalogue pages at 100; walk it rather than judging from page one.
          rows, page = [], 1
          while page <= 40:
              url = ("https://api.blockworks.com/v1/metrics?"
                     + urllib.parse.urlencode({"page": page, "limit": 100}))
              # The edge in front of the API answers 403 to the default
              # python-urllib agent -- refresh_data.py carries the same note.
              req = urllib.request.Request(url, headers={
                  "x-api-key": key,
                  "User-Agent": "solana-dashboard/1.0 (+metrics-catalogue)",
              })
              raw = json.load(urllib.request.urlopen(req, timeout=60))
              batch = raw if isinstance(raw, list) else (
                      raw.get("data") or raw.get("metrics") or raw.get("results") or [])
              if not batch:
                  break
              rows += batch
              if len(batch) < 100:
                  break
              page += 1

          # Charts are a separate catalogue from metrics, and some series only
          # exist as a curated chart (vault balances, for one).
          # Charts page at 100 as well; one page is not the catalogue.
          charts, page = [], 1
          while page <= 40:
              try:
                  url = ("https://api.blockworks.com/v1/charts?"
                         + urllib.parse.urlencode({"page": page, "limit": 100}))
                  req = urllib.request.Request(
                      url, headers={"x-api-key": key,
                                    "User-Agent": "solana-dashboard/1.0 (+metrics-catalogue)"})
                  raw = json.load(urllib.request.urlopen(req, timeout=60))
                  batch = raw if isinstance(raw, list) else (
                          raw.get("data") or raw.get("charts") or raw.get("results") or [])
              except Exception as e:
                  print(f"  charts page {page}: {e}")
                  break
              if not batch:
                  break
              charts += batch
              if len(batch) < 100:
                  break
              page += 1
          if charts:
              print(f"\ncharts catalogue holds {len(charts)}; matching {want!r}")
              for c in charts:
                  if not isinstance(c, dict):
                      continue
                  blob = " ".join(str(c.get(k, "")) for k in
                                  ("id", "name", "title", "slug", "description"))
                  if want in blob.lower():
                      print(f"  id={c.get('id')}  {str(c.get('name') or c.get('title'))[:70]}")
              print()

          print(f"catalogue holds {len(rows)} metrics; matching {want!r}\n")
          hits = 0
          for m in rows:
              if not isinstance(m, dict):
                  continue
              # `identifier` is the slug the /v1/metrics/{slug} calls take.
              slug = m.get("identifier") or m.get("slug") or ""
              title = m.get("name") or ""
              desc = m.get("description") or ""
              proj = m.get("project") or ""
              if want in f"{slug} {title} {desc} {proj}".lower():
                  hits += 1
                  print(f"  {slug:<46} {str(title)[:70]}")
          print(f"\n{hits} match(es)")
          PY
