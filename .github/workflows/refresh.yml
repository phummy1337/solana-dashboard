name: Refresh dashboard data

on:
  schedule:
    # Blockworks metrics land on a daily cadence, so twice a day is plenty.
    - cron: "20 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certifi
        run: pip install --quiet certifi

      - name: Refresh data.json
        env:
          BLOCKWORKS_API_KEY: ${{ secrets.BLOCKWORKS_API_KEY }}
        run: python3 refresh_data.py

      - name: Fail if the refresh reported problems
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("data.json"))
          w = d.get("warnings") or []
          for line in w:
              print(f"::warning::{line}")
          # A run that resolved nothing means the key or the API broke; don't
          # commit a gutted data.json over a good one.
          if not d.get("stats", {}).get("price"):
              sys.exit("refresh produced no price data — refusing to commit")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No change."
          else
            git add data.json
            git commit -m "data refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
