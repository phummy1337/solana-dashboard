name: Build and deploy

# data.json is no longer committed. It is built (or carried over from the live
# site) at deploy time and published as a Pages artifact, so the repo stops
# accumulating a public snapshot of the licensed feeds on every refresh.

on:
  push:
    branches: [main]
  # Primary schedule: a Cloudflare Worker cron trigger (see worker/) fires this
  # on time. GitHub's own `schedule` event is best-effort — measured on this
  # repo over six days it delivered 2-3 of 4 runs a day, with the last one
  # landing 2-3 hours late — which is fine for a dashboard but useless if you
  # ever want a job pinned to a clock edge.
  repository_dispatch:
    types: [refresh]
  schedule:
    # Kept as a safety net, not the primary trigger: one late run a day is far
    # better than none if the Worker or its token ever stops. Deliberately off
    # the hour, which is when GitHub's queue is most congested.
    - cron: "37 20 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Rebuild data.json from the upstream APIs"
        type: boolean
        default: true
      seed_run:
        description: "Recovery: take data.json from this run's Pages artifact instead of the live site"
        type: string
        default: ""
      seed_url:
        description: "Recovery: fetch data.json from this URL instead of the live site"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read           # recovery seeding reads an earlier run's artifact

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Captures of DefiLlama's front end, kept in a private repo rather than
      # this public one so their dataset is not archived in a world-readable
      # git history. refresh_data.py prefers them over the metered API and
      # falls back on its own when they are absent or stale, so a missing
      # token degrades to the old behaviour instead of failing the build.
      - name: Fetch the data captures
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: phummy1337/solana-dashboard-data
          # A read-only deploy key on that repo, not a PAT: it cannot reach any
          # other repo and cannot write to this one.
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: .captures

      - name: Stage the captures
        run: |
          if [ ! -d .captures/local ]; then
            echo "no captures — perps and RWA fall back to the API"
            exit 0
          fi
          cp -r .captures/local ./local
          python3 - <<'PY'
          import glob, json
          for f in sorted(glob.glob("local/*.json")):
              b = json.load(open(f))
              print(f'  {f} -> {b["last"]} ({len(b["chains"])} chains)')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certifi
        run: pip install --quiet certifi

      - name: Obtain data.json
        env:
          BLOCKWORKS_API_KEY: ${{ secrets.BLOCKWORKS_API_KEY }}
          # Metered: perps only, ~11 calls per refresh. See refresh_data.py.
          DEFILLAMA_API_KEY: ${{ secrets.DEFILLAMA_API_KEY }}
          EVENT: ${{ github.event_name }}
          WANT_REFRESH: ${{ github.event.inputs.refresh }}
          SEED_RUN: ${{ github.event.inputs.seed_run }}
          SEED_URL: ${{ github.event.inputs.seed_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recovery hatch: when the live file is already damaged, take the
          # baseline from an earlier build of this same site instead. It is the
          # site's own artifact, so nothing new is exposed and nothing is added
          # to the repo. seed_url does the same from a one-off location, for a
          # baseline repaired by hand.
          if [ -n "$SEED_URL" ]; then
            curl -fsSL --max-time 180 -o prev.json "$SEED_URL"
            python3 -c "import json,sys; sys.exit(0 if json.load(open('prev.json')).get('stats',{}).get('price') else 1)"
            echo "Seeded from seed_url ($(wc -c < prev.json) bytes)"
          elif [ -n "$SEED_RUN" ]; then
            gh run download "$SEED_RUN" -R "$GITHUB_REPOSITORY" -n github-pages -D seed
            tar -xf seed/artifact.tar -C seed
            cp seed/data.json prev.json
            echo "Seeded from run $SEED_RUN ($(wc -c < prev.json) bytes)"
          # The live file is fetched on every run, not just the ones that reuse
          # it: a refresh carries its series forward for anything the upstream
          # fails to return, and the publish check below compares against it.
          elif curl -fsS --max-time 120 -o prev.json https://stateofsol.com/data.json \
             && python3 -c "import json,sys; sys.exit(0 if json.load(open('prev.json')).get('stats',{}).get('price') else 1)"; then
            echo "Fetched the live data.json ($(wc -c < prev.json) bytes)"
          else
            echo "No usable live data.json"
            rm -f prev.json
          fi
          # A push is normally a content change, not a data change. Reuse what
          # is already live rather than spending fifteen minutes and a CoinGecko
          # rate limit rebuilding an identical file. Anything that cannot be
          # reused falls through to a full refresh, so a deploy never ships
          # without data.
          reuse=false
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$WANT_REFRESH" = "false" ]; }; then
            if [ -f prev.json ]; then
              cp prev.json data.json
              reuse=true
              echo "Reused the live data.json"
            else
              echo "Live data.json unusable — refreshing instead"
            fi
          fi
          if [ "$reuse" = false ]; then
            # refresh_data.py reads data.json as its previous run and overwrites it
            [ -f prev.json ] && cp prev.json data.json
            python3 refresh_data.py
          fi

      - name: Check the data before publishing it
        run: |
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("data.json"))
          for line in d.get("warnings") or []:
              print(f"::warning::{line}")
          # A run that resolved nothing means the key or an API broke; don't
          # deploy a gutted data.json over a good one.
          if not d.get("stats", {}).get("price"):
              sys.exit("no price data — refusing to deploy")

          # A price alone is not enough: on 2026-09-14 Blockworks rate-limited
          # every metric call partway through a run, and a file with a price and
          # nine missing cards sailed past this check and replaced a good one.
          # Nothing the live file carries may vanish unless it had already gone
          # stale past the window refresh_data.py carries forward.
          def last_date(v):
              if isinstance(v, list):
                  return v[-1].get("d") if v and isinstance(v[-1], dict) else None
              if isinstance(v, dict):
                  ds = [x[-1]["d"] for x in v.values()
                        if isinstance(x, list) and x and isinstance(x[-1], dict) and "d" in x[-1]]
                  return max(ds) if ds else None
              return None
          if os.path.exists("prev.json"):
              from datetime import date, timedelta
              cut = (date.today() - timedelta(days=30)).isoformat()   # matches refresh_data.py
              p = json.load(open("prev.json"))
              for kind in ("compare", "series"):
                  lost = [k for k, v in (p.get(kind) or {}).items()
                          if not (d.get(kind) or {}).get(k) and (last_date(v) or "") >= cut]
                  if lost:
                      sys.exit(f"{kind} lost {sorted(lost)} against the live file "
                               f"— refusing to deploy")
          PY

      - name: Assemble the site
        run: |
          # Only what the site serves. The scripts, workflow and README used to
          # be published too, purely because Pages served the repo root.
          mkdir -p _site
          cp index.html data.json highlights.json CNAME robots.txt sitemap.xml \
             og-card-v4.png dfdv-logo.png _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
